packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
  OpenCommanderNTFS:
    path: ../ntfs/OpenCommanderNTFS

name: OpenCommander
options:
  bundleIdPrefix: com.github.niklaus85
targets:
  OpenCommander:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    dependencies:
      - package: ZIPFoundation
      - target: OpenCommanderNTFSModule
        embed: true
        link: false
        platformFilter: macOS
    sources:
      - path: OpenCommander
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSSupportsOpeningDocumentsInPlace: true
        LSApplicationCategoryType: public.app-category.utilities
        NSDesktopFolderUsageDescription: OpenCommander needs access to manage files on your Desktop.
        NSDocumentsFolderUsageDescription: OpenCommander needs access to manage files in Documents.
        NSDownloadsFolderUsageDescription: OpenCommander needs access to manage files in Downloads.
        NSRemovableVolumesUsageDescription: OpenCommander needs access to manage files on external drives.
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        GENERATE_INFOPLIST: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.github.niklaus85.OpenCommander
        SWIFT_VERSION: 5.0
        DEVELOPMENT_TEAM: WB497999XX
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.2
        CURRENT_PROJECT_VERSION: 8
        SUPPORTS_MACCATALYST: "YES"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: "NO"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: OpenCommander App Store
  OpenCommanderNTFSModule:
    type: extensionkit-extension
    platform: macOS
    deploymentTarget: "15.4"
    configFiles:
      Debug: OpenCommanderNTFSModule/NTFS3G.xcconfig
      Release: OpenCommanderNTFSModule/NTFS3G.xcconfig
    preBuildScripts:
      - name: Build NTFS-3G engine
        script: 'sh "$PROJECT_DIR/../ntfs/NTFS3G/build-engine.sh"'
        inputFiles:
          - $(PROJECT_DIR)/../ntfs/NTFS3G/build-engine.sh
          - $(PROJECT_DIR)/../ntfs/NTFS3G/vendor/ntfs-3g_ntfsprogs-2026.7.7.tgz
        outputFiles:
          - $(PROJECT_DIR)/../ntfs/NTFS3G/.build-native/ntfs-3g-2026.7.7/libntfs-3g/.libs/libntfs-3g.a
          - $(PROJECT_DIR)/../ntfs/NTFS3G/.build-native/ntfs-3g-2026.7.7/config.h
    dependencies:
      - package: OpenCommanderNTFS
      - sdk: FSKit.framework
      - sdk: ExtensionFoundation.framework
    sources:
      - path: OpenCommanderNTFSModule
        excludes:
          - Info.plist
          - OpenCommanderNTFSModule.entitlements
    info:
      path: OpenCommanderNTFSModule/Info.plist
      properties:
        CFBundleDisplayName: OpenCommander NTFS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.fskit.fsmodule
          FSActivateOptionSyntax:
            shortOptions: "g:m:o:u:"
          FSCheckOptionSyntax:
            shortOptions: "nqy"
          FSFormatOptionSyntax:
            shortOptions: ""
          FSMediaTypes: {}
          FSPersonalities:
            OpenCommanderNTFSPersonality:
              FSfileObjectsAreCaseSensitive: false
              FSName: OpenCommander NTFS
          FSRequiresSecurityScopedPathURLResources: false
          FSShortName: openntfs
          FSSupportsBlockResources: true
          FSSupportsGenericURLResources: false
          FSSupportsPathURLs: false
          FSSupportsServerURLs: false
    entitlements:
      path: OpenCommanderNTFSModule/OpenCommanderNTFSModule.entitlements
      properties:
        com.apple.developer.fskit.fsmodule: true
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.niklaus85.OpenCommander.NTFSModule
        PRODUCT_NAME: OpenCommanderNTFSModule
        INFOPLIST_KEY_CFBundleDisplayName: OpenCommander NTFS
        MARKETING_VERSION: 1.2
        CURRENT_PROJECT_VERSION: 8
        SKIP_INSTALL: "YES"
        SWIFT_VERSION: 5.0
        DEVELOPMENT_TEAM: WB497999XX
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/../Frameworks'
          - '@executable_path/../../../../Frameworks'
  OpenCommanderUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OpenCommanderUITests
    dependencies:
      - target: OpenCommander
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.niklaus85.OpenCommander.UITests
        DEVELOPMENT_TEAM: WB497999XX
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: 5.0
