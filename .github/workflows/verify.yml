name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: python3 ios/localization_parity_test.py
      - run: tests/run-java-safety.sh
      - run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: app/build/reports/lint-results-debug.*

  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: tests/run-swift-safety.sh
      - run: swift test --package-path ntfs/OpenCommanderNTFS
      - name: Build iOS Simulator app
        run: >-
          xcodebuild -project ios/OpenCommander.xcodeproj -scheme OpenCommander
          -destination 'generic/platform=iOS Simulator' -configuration Debug
          CODE_SIGNING_ALLOWED=NO build
